<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROLANAStudio - Brangkas-YT</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #0ea5e9;
            --danger: #ef4444;
            --success: #22c55e;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; }
        .login-container { max-width: 400px; margin: 100px auto; background: var(--card-bg); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid var(--border-color); text-align: center; }
        .login-container h2 { margin-bottom: 20px; color: var(--primary); }
        .login-container input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-color); border: 1px solid var(--border-color); color: white; border-radius: 6px; box-sizing: border-box; }
        .login-container button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        .app-container { display: none; max-width: 1200px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 25px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .brand h1 { margin: 0; font-size: 20px; display: flex; align-items: center; gap: 10px; }
        .brand span { font-size: 12px; color: var(--text-muted); font-weight: normal; }
        
        .nav-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn { background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 15px; border-radius: 20px; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; text-decoration: none; }
        .btn-primary { background: var(--primary); border: none; color: white; }
        .btn-danger { background: var(--danger); border: none; color: white; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 20px; border-radius: 10px; border: 1px solid var(--border-color); }
        .stat-card h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--text-muted); }
        .stat-card .val { font-size: 28px; font-weight: bold; }

        .content-box { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); }
        .table-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        .search-filter { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .search-filter input, .search-filter select { background: var(--bg-color); border: 1px solid var(--border-color); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; }
        
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); font-weight: 600; font-size: 12px; text-transform: uppercase; }
        .badge-active { background: rgba(34, 197, 94, 0.2); color: var(--success); padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .badge-monet { background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 4px; }
        
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: 12px; width: 400px; border: 1px solid var(--border-color); }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin-bottom: 12px; background: var(--bg-color); border: 1px solid var(--border-color); color: white; border-radius: 6px; box-sizing: border-box; }
    </style>
</head>
<body>

    <!-- HALAMAN LOGIN -->
    <div id="loginPage" class="login-container">
        <h2>ROLANAStudio</h2>
        <p style="color:var(--text-muted); font-size:14px; margin-bottom:20px;">Silakan masukkan kata sandi untuk masuk</p>
        <input type="password" id="passwordInput" placeholder="Password (bebas, cth: 1234)">
        <button onclick="login()">Masuk ke Brangkas-YT</button>
    </div>

    <!-- HALAMAN UTAMA (DASHBOARD) -->
    <div id="appPage" class="app-container">
        <div class="header">
            <div class="brand">
                <h1>🔒 Brangkas-YT <span>ROLANAStudio</span></h1>
                <div id="userInfo" style="font-size:12px; color:var(--text-muted);"></div>
            </div>
            <div class="nav-actions">
                <button class="btn">Tutorial</button>
                <button class="btn">Cari Channel YT</button>
                <button class="btn btn-primary" onclick="syncData()">Sync Stats</button>
                <button class="btn btn-danger" onclick="logout()">Keluar</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Channel</h3>
                <div class="val" id="totalChannels">0</div>
            </div>
            <div class="stat-card">
                <h3>Sudah Monetisasi</h3>
                <div class="val" id="totalMonet">0</div>
            </div>
            <div class="stat-card">
                <h3>Channel Aktif</h3>
                <div class="val" id="totalActive">0</div>
            </div>
        </div>

        <div class="content-box">
            <div style="color:var(--primary); font-size:12px; font-weight:bold; margin-bottom:5px;">KOLEKSI PRIBADI</div>
            <div class="table-toolbar">
                <h3 style="margin:0;">Daftar Channel & Akun</h3>
                <button class="btn btn-primary" onclick="bukaModalTambah()">+ Tambah Channel</button>
            </div>

            <div class="search-filter">
                <input type="text" id="searchInput" placeholder="Cari nama, ID..." onkeyup="renderTable()">
                <select id="filterMonet" onchange="renderTable()">
                    <option value="">SEMUA MONETISASI</option>
                    <option value="Ya">Sudah Monet</option>
                    <option value="Belum">Belum Monet</option>
                </select>
                <select id="filterPengelola" onchange="renderTable()">
                    <option value="">SEMUA PENGELOLA</option>
                </select>
            </div>

            <div style="overflow-x: auto; margin-top: 15px;">
                <table>
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama Channel</th>
                            <th>Link</th>
                            <th>Subscribers</th>
                            <th>Total Views</th>
                            <th>Video</th>
                            <th>Pengelola</th>
                            <th>Niche</th>
                            <th>Status</th>
                            <th>Monet</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data terisi otomatis -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL TAMBAH CHANNEL -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">Tambah Channel Baru</h3>
            <input type="text" id="inputChannelId" placeholder="Channel ID (cth: UC...)">
            <input type="text" id="inputPengelola" placeholder="Nama Pengelola (cth: ROY)">
            <input type="text" id="inputNiche" placeholder="Niche (cth: Musik)">
            <select id="inputMonet">
                <option value="Belum">Belum Monetisasi</option>
                <option value="Ya">Sudah Monetisasi</option>
            </select>
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn btn-primary" style="flex:1;" onclick="simpanChannelBaru()">Simpan</button>
                <button class="btn" style="flex:1;" onclick="tutupModalTambah()">Batal</button>
            </div>
        </div>
    </div>

<script>
    let appData = { channels: [] };

    function login() {
        const pass = document.getElementById('passwordInput').value;
        if(pass) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            document.getElementById('userInfo').innerText = `Terhubung • ${newtoLocaleString ? '' : new Date().toLocaleDateString()}`;
            loadData();
        } else {
            alert('Masukkan password terlebih dahulu!');
        }
    }

    function logout() {
        document.getElementById('appPage').style.display = 'none';
        document.getElementById('loginPage').style.display = 'block';
    }

    async function loadData() {
        try {
            const res = await fetch('data.json?t=' + new Date().getTime());
            if(res.ok) {
                appData = await res.json();
            }
        } catch(e) {
            console.log('Belum ada file data.json, menggunakan data lokal.');
        }
        updateStats();
        renderTable();
        isiFilterPengelola();
    }

    function updateStats() {
        const total = appData.channels.length;
        const monet = appData.channels.filter(c => c.monet === 'Ya').length;
        const active = appData.channels.filter(c => c.status === 'Aktif' || !c.status).length;
        
        document.getElementById('totalChannels').innerText = total;
        document.getElementById('totalMonet').innerText = monet;
        document.getElementById('totalActive').innerText = active;
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        
        const search = document.getElementById('searchInput').value.toLowerCase();
        const fMonet = document.getElementById('filterMonet').value;
        const fPengelola = document.getElementById('filterPengelola').value;

        let filtered = appData.channels.filter(c => {
            const matchSearch = (c.name || '').toLowerCase().includes(search) || c.id.toLowerCase().includes(search);
            const matchMonet = fMonet === "" || c.monet === fMonet;
            const matchPengelola = fPengelola === "" || c.pengelola === fPengelola;
            return matchSearch && matchMonet && matchPengelola;
        });

        if(filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="11" style="text-align:center; color:var(--text-muted);">Belum ada channel. Klik "+ Tambah Channel" di atas.</td></tr>`;
            return;
        }

        filtered.forEach((c, index) => {
            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td>
                <td><b>${c.name || 'Memuat...'}</b></td>
                <td><a href="https://www.youtube.com/channel/${c.id}" target="_blank" style="color:var(--primary);">Buka ↗</a></td>
                <td>${Number(c.subs || 0).toLocaleString()}</td>
                <td>${Number(c.views || 0).toLocaleString()}</td>
                <td>${c.videos || 0}</td>
                <td>${c.pengelola || '-'}</td>
                <td>${c.niche || '-'}</td>
                <td><span class="badge-active">Aktif</span></td>
                <td><span class="badge-monet">${c.monet === 'Ya' ? '💲' : '🔒'}</span></td>
                <td>
                    <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="hapusChannel('${c.id}')">Hapus</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function isiFilterPengelola() {
        const select = document.getElementById('filterPengelola');
        let pengelolaSet = [...new Set(appData.channels.map(c => c.pengelola).filter(Boolean))];
        select.innerHTML = '<option value="">SEMUA PENGELOLA</option>';
        pengelolaSet.forEach(p => {
            select.innerHTML += `<option value="${p}">${p}</option>`;
        });
    }

    function bukaModalTambah() { document.getElementById('addModal').style.display = 'flex'; }
    function tutupModalTambah() { document.getElementById('addModal').style.display = 'none'; }

    async function simpanChannelBaru() {
        const id = document.getElementById('inputChannelId').value.trim();
        const pengelola = document.getElementById('inputPengelola').value.trim();
        const niche = document.getElementById('inputNiche').value.trim();
        const monet = document.getElementById('inputMonet').value;

        if(!id) return alert('Masukkan Channel ID!');

        // Ambil data awal dari YouTube via Client-side fetch
        const API_KEY = 'MASUKKAN_API_KEY_ANDA_DI_SINI'; // Nanti diambil otomatis atau manual
        appData.channels.push({
            id: id,
            name: 'Channel ' + appData.channels.length,
            subs: 0,
            views: 0,
            videos: 0,
            pengelola: pengelola,
            niche: niche,
            monet: monet,
            history: []
        });

        tutupModalTambah();
        renderTable();
        updateStats();
        alert('Channel berhasil ditambahkan! Untuk menyimpan secara permanen di GitHub, pastikan skrip aksi harian berjalan atau perbarui file data.json.');
    }

    function hapusChannel(id) {
        if(confirm('Hapus channel dari daftar?')) {
            appData.channels = appData.channels.filter(c => c.id !== id);
            renderTable();
            updateStats();
        }
    }

    function syncData() {
        alert('Fitur Sync Stats berjalan otomatis setiap hari via GitHub Actions, atau Anda bisa memperbarui data langsung dari server!');
        loadData();
    }
</script>

</body>
</html>
